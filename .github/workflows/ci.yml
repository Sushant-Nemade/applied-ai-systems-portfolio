name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        env:
          APP_ENV: test
        run: pytest -q
